[package]
name = "openshell-admission-hook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenShell gateway interceptor that rewrites Windows bind-mount sources for Docker/Podman sandboxes, plus a launcher that starts it before the gateway"

[[bin]]
name = "openshell-admission-hook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml_edit = "0.23"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
ureq = "3"
